name: Build
permissions:
  contents: write
on:
  workflow_dispatch:
  push:

jobs: 
  build_kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false
      - name: Create Swap File
        run: |
          # Create a 12GB swap file
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          # Verify the memory increase
          echo "Memory status after swap:"
          free -h
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Vanilla Kernel
        run: |
          ./build.sh --vanilla
      - name: Clean and Build KSU Kernel
        run: |
          rm -rf out AnyKernel3
          ./build.sh --ksu
      
      - name: Get KSU Version
        id: ksu_version
        run: |
          if [ -f build/ksu_version.txt ]; then
            KSU_VERSION=$(cat build/ksu_version.txt)
            echo "ksu_version=${KSU_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "ksu_version=unknown" >> $GITHUB_OUTPUT
          fi

      - uses: actions/upload-artifact@v4
        with:
          path: |
            build/*
          compression-level: 0
          
      - name: Publish
        id: release
        uses: softprops/action-gh-release@v2.4.2
        with:
          files: build/*
          name: KERNEL_${{ github.run_number }}
          tag_name: ${{ github.run_number }}
          
          body: |
            **DMXQ-KERNEL**:
            **Thanks to @edgars-cirulis**
            WILL ONLY WORK ON ONEUI!!!! THIS IS NOT AOSP COMPATIBLE!!!! I AM NOT RESPONSIBLE FOR YOUR DEVICE NOT BOOTING/ BEING BRICKED, ANYTHING ELSE!
            
            This release includes two kernel versions:
            - **DMXQ-KERNEL-KSU.ZIP** - KernelSU-Next ${{ steps.ksu_version.outputs.ksu_version }} included ([KernelSU Next apk](https://github.com/KernelSU-Next/KernelSU-Next/releases))
            - **DMXQ-KERNEL-Vanilla.ZIP** - Vanilla build (no KernelSU)
            
            Uncompressed kernel images (for manual flashing):
            - **DMXQ-KERNEL-Image** - KernelSU-Next kernel image
            - **DMXQ-KERNEL-Image-Vanilla** - Vanilla kernel image
            
            - **Run Number:** ${{ github.run_number }}
